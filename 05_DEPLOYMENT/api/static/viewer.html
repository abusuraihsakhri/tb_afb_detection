<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WSI DeepZoom Viewer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ui.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js" referrerpolicy="no-referrer"></script>
</head>
<body>
  <div class="app-container glassmorphism wide">
    <header>
      <h1>WSI <span class="highlight">DeepZoom</span> Viewer</h1>
      <p id="slide-info">Loading slide metadata...</p>
      <p class="notice">The slide must already exist in <code>01_DATA/raw_wsi</code>.</p>
    </header>
    <div id="openseadragon-viewer" class="viewer"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const wsiId = params.get('id');
    const info = document.getElementById('slide-info');

    async function start() {
      if (!wsiId) {
        info.textContent = 'No slide ID supplied.';
        return;
      }
      const encoded = encodeURIComponent(wsiId);
      const response = await fetch(`/api/v1/wsi/info/${encoded}`);
      if (!response.ok) {
        info.textContent = 'Could not load slide metadata.';
        return;
      }
      const meta = await response.json();
      info.textContent = `${wsiId} — ${meta.width} × ${meta.height}px`;
      OpenSeadragon({
        id: 'openseadragon-viewer',
        prefixUrl: 'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/',
        tileSources: {
          width: meta.width,
          height: meta.height,
          tileSize: meta.tile_size,
          tileOverlap: meta.tile_overlap,
          minLevel: 0,
          maxLevel: meta.level_count - 1,
          getTileUrl(level, x, y) {
            return `/api/v1/wsi/tile/${encoded}/${level}/${x}/${y}`;
          },
        },
        showNavigator: true,
        navigatorPosition: 'BOTTOM_RIGHT',
        constrainDuringPan: true,
        maxZoomPixelRatio: 2,
        visibilityRatio: 1,
      });
    }

    start().catch(() => { info.textContent = 'Viewer initialization failed.'; });
  </script>
</body>
</html>
