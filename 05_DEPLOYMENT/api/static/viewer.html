<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local WSI Viewer | TB-AFB</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.0.2/build/openseadragon/openseadragon.min.js" integrity="sha512-gPZzE+sKmE0kvcjMxW431ef5b5T5QOADV9Gij0isPw2oLATd1IZW7dmDmKh7F2e5BfwjQyAfFp3/OF0fVMOF7Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <div class="app-container glassmorphism viewer-layout">
        <header>
            <h1>Local <span class="highlight">WSI</span> Viewer</h1>
            <p id="slide-info">Loading...</p>
        </header>
        <div id="openseadragon-viewer" class="wsi-viewer"></div>
    </div>
    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        const info = document.getElementById('slide-info');
        if (!id) {
            info.textContent = 'No slide ID provided.';
        } else {
            info.textContent = `Slide: ${id}`;
            fetch(`/api/v1/wsi/info/${encodeURIComponent(id)}`)
                .then(async response => {
                    const payload = await response.json();
                    if (!response.ok) throw new Error(payload.detail || 'Unable to load WSI metadata.');
                    return payload;
                })
                .then(meta => {
                    OpenSeadragon({
                        id: 'openseadragon-viewer',
                        prefixUrl: 'https://cdn.jsdelivr.net/npm/openseadragon@6.0.2/build/openseadragon/images/',
                        tileSources: {
                            width: meta.width,
                            height: meta.height,
                            tileSize: meta.tile_size,
                            tileOverlap: meta.tile_overlap,
                            getTileUrl(level, x, y) {
                                return `/api/v1/wsi/tile/${encodeURIComponent(id)}/${level}/${x}/${y}`;
                            },
                        },
                        showNavigator: true,
                        maxZoomPixelRatio: 2,
                    });
                })
                .catch(error => { info.textContent = error.message; });
        }
    </script>
</body>
</html>
