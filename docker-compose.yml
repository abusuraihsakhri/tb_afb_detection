services:
  tb-afb-api:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./01_DATA:/app/01_DATA
      - ./03_MODELS:/app/03_MODELS
      - ./06_LOGS:/app/06_LOGS
    environment:
      PYTHONUNBUFFERED: "1"
      TB_AFB_ENABLE_TRAINING_TRIGGER: "0"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
