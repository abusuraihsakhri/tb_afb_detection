name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q 02_CODE 05_DEPLOYMENT/api
      - name: Critical lint checks
        run: ruff check --select E9,F63,F7,F82 02_CODE 05_DEPLOYMENT/api tests
      - name: Core unit tests
        env:
          PYTHONPATH: 02_CODE/src
        run: pytest -q
