name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q 02_CODE 05_DEPLOYMENT/api
      - name: Package build
        run: python -m build 02_CODE
      - name: Dependency vulnerability audit
        run: pip-audit --no-deps -r requirements.txt
      - name: Critical lint checks
        run: ruff check --select E9,F63,F7,F82 02_CODE 05_DEPLOYMENT/api tests
      - name: Launcher syntax
        run: bash -n Start_Detection_Engine.sh Start_Annotation_Engine.sh
      - name: Browser JavaScript syntax
        run: node --check 05_DEPLOYMENT/api/static/app.js && node --check 05_DEPLOYMENT/api/static/annotate.js
      - name: Compose validation
        run: docker compose config --quiet
      - name: Core unit tests
        env:
          PYTHONPATH: 02_CODE/src
        run: pytest -q
