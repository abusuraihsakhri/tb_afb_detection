name: Pages Showcase Verification

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "index.html"
      - ".nojekyll"
      - ".github/workflows/pages-showcase.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl -sS -o pages-build.json -w "%{http_code}"             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
          if [ "${status}" != "201" ] && [ "${status}" != "202" ]; then
            cat pages-build.json
            exit 1
          fi

      - name: Verify published showcase
        run: |
          base="https://abusuraihsakhri.github.io/tb_afb_detection/"
          for attempt in $(seq 1 18); do
            root="$(curl -fsSL "${base}" || true)"
            if printf '%s' "${root}" | grep -q "AFB candidate detection for microscopy"; then
              exit 0
            fi

            docs="$(curl -fsSL "${base}docs/" || true)"
            if printf '%s' "${docs}" | grep -q "AFB candidate detection for microscopy"; then
              exit 0
            fi

            sleep 10
          done

          echo "Published Pages content did not match the expected showcase."
          exit 1
